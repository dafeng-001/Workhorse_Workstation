[Everything]
run_count=10
show_in_tray=0
start_minimized=1
exit_on_close=0
check_for_updates_on_startup=0
allow_ipc_window_open=1
show_toolbar=0
show_statusbar=0
show_splash=0
allow_multiple_instances=0
minimize_to_tray=0
close_to_tray=1
run_as_admin=0
# Prefer service if already installed; never show first-run index wizard
install_service_on_first_run=0
# empty = don't attach NTFS volumes in this portable config on first paint
ntfs_volume_guids=
# folder index roots are configured by the app at runtime
